services:
  postgres:
    image: postgres:16
    container_name: oitassist-db
    environment:
      POSTGRES_DB: oitassist
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/ita-social-projects/oitassist/build:latest
    container_name: oitassist-backend
    depends_on:
      - postgres
    ports:
      - "80:8080"
    environment:
      DATASOURCE_URL: ${DATASOURCE_URL}
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}
      DATASOURCE_DRIVER: ${DATASOURCE_DRIVER}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_LIQUIBASE_ENABLED: ${SPRING_LIQUIBASE_ENABLED}
      SPRING_LIQUIBASE_CHANGE_LOG: ${SPRING_LIQUIBASE_CHANGE_LOG}
      SPRING_LIQUIBASE_DROP_FIRST: ${SPRING_LIQUIBASE_DROP_FIRST}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL}
      JPA_OPEN_IN_VIEW: ${JPA_OPEN_IN_VIEW}
      JPA_HIBERNATE_DDL_AUTO: ${JPA_HIBERNATE_DDL_AUTO}
      JWT_ENCRYPTED_KEY: ${JWT_ENCRYPTED_KEY}
      JWT_SIGN_KEY: ${JWT_SIGN_KEY}
      JWT_VALIDITY: ${JWT_VALIDITY}
      LOG_LEVEL_LOGBOOK: ${LOG_LEVEL_LOGBOOK}

  prometheus:
    image: prom/prometheus
    container_name: oitassist-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter
    container_name: oitassist-node-exporter
    ports:
      - "9100:9100"

volumes:
  postgres_data: