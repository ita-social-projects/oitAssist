services:
  postgres:
    image: postgres:16
    container_name: oitassist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: oitassist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/ita-social-projects/oitassist/build:latest
    container_name: oitassist-backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local

      # --- DATABASE ---
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/oitassist
      DATASOURCE_USERNAME: postgres
      DATASOURCE_PASSWORD: postgres
      DATASOURCE_DRIVER: org.postgresql.Driver

      # --- LIQUIBASE ---
      LIQUIBASE_ENABLED: true
      LIQUIBASE_CHANGE_LOG: classpath:db/changelog/db.changelog-master.xml
      LIQUIBASE_DROP_FIRST: false

      # --- JPA ---
      JPA_SHOW_SQL: true
      JPA_OPEN_IN_VIEW: false
      JPA_HIBERNATE_DDL_AUTO: update

volumes:
  postgres_data:
