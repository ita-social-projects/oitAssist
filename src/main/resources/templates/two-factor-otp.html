<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Код підтвердження</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333333;
        }

        p {
            font-size: 16px;
            color: #555555;
            line-height: 1.5;
        }

        .otp-code {
            display: block;
            font-family: 'Courier New', Courier, monospace;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #1a73e8;
            background-color: #f0f4fd;
            border-radius: 6px;
            padding: 16px 24px;
            text-align: center;
            margin: 24px 0;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888888;
        }

    </style>
</head>
<body>
<div class="container">
    <h1>Вітаємо!</h1>
    <p>Використайте цей код для підтвердження входу за допомогою двофакторної автентифікації:</p>

    <span class="otp-code">${code}</span>

    <p>Код дійсний протягом ${validityMinutes} хв.</p>

    <p>Якщо ви не запитували цей код, просто проігноруйте цей лист.</p>

    <div class="footer">
        © 2026 OIT Assist. Усі права захищені.
    </div>
</div>
</body>
</html>
