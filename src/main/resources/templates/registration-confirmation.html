<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Підтвердження Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333333;
        }

        p {
            font-size: 16px;
            color: #555555;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            background-color: #1a73e8;
            color: #ffffff !important;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888888;
        }

    </style>
</head>
<body>
<div class="container">
    <h1>Привіт, ${name}!</h1>
    <p>Дякуємо за реєстрацію на нашому сайті. Щоб активувати ваш акаунт, будь ласка, натисніть кнопку нижче:</p>
    <a href="${link}" class="button">Підтвердити Email</a>

    <p>Якщо ви не реєструвались, просто проігноруйте цей лист.</p>

    <div class="footer">
        © 2026 OIT Assist. Усі права захищені.
    </div>
</div>
</body>
</html>
