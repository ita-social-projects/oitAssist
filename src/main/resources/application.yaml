server:
  port: 8080

spring:
  application:
    name: ${APP_NAME:oit-assist}

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:false}
    change-log: ${SPRING_LIQUIBASE_CHANGE_LOG}
    drop-first: ${SPRING_LIQUIBASE_DROP_FIRST:false}

  jpa:
    show-sql: ${JPA_SHOW_SQL}
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:validate}

  servlet:
    multipart:
      max-file-size: ${FILE_UPLOAD_MAX_FILE_SIZE:8MB}
      max-request-size: ${FILE_UPLOAD_MAX_REQUEST_SIZE:8MB}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTIONTIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITETIMEOUT:5000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
          microsoft:
            provider: microsoft
            client-id: ${MICROSOFT_CLIENT_ID}
            client-secret: ${MICROSOFT_CLIENT_SECRET}
            scope: openid, email, profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Microsoft
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/common/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: email

oit:
  swagger:
    servers:
      - url: ${LOCALHOST_SWAGGER_SERVER:http://localhost:8080}
        description: Local
      - url: ${STAGE_SWAGGER_SERVER:https://stage.myapp.com}
        description: Stage
      - url: ${PROD_SWAGGER_SERVER:https://api.myapp.com}
        description: Production

jwt:
  encrypted-key: ${JWT_ENCRYPTED_KEY}
  sign-key: ${JWT_SIGN_KEY}
  validity: ${JWT_VALIDITY:600000}
  refresh-validity: ${JWT_REFRESH_VALIDITY:1209600000}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.itasocialacademy.oitassist: ${LOG_LEVEL_APP:DEBUG}
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
    org.zalando.logbook: ${LOG_LEVEL_LOGBOOK:INFO}
  file:
    name: ${LOG_FILE:logs/app.log}
  pattern:
    console: ${LOG_CONSOLE_PATTERN:%green(%d{yyyy-MM-dd HH:mm:ss.SSS}) %highlight(%-5level) %yellow([%thread]) %cyan(%logger{28}) %yellow([%X{traceId:-}]) - %msg%n}
    file: ${LOG_FILE_PATTERN:%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [%X{traceId:-}] - %msg%n}

logbook:
  format:
    style: json

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /docs

web_client:
  origin: ${WEB_CLIENT_ORIGIN}
  oauth-callback-path: ${WEB_CLIENT_OAUTH_CALLBACK_PATH:/oauth/callback}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

graph:
  tenant-id: ${GRAPH_TENANT_ID}
  client-id: ${GRAPH_CLIENT_ID}
  client-secret: ${GRAPH_CLIENT_SECRET}
  drive-id: ${GRAPH_DRIVE_ID}

app:
  storage:
    local:
      root: ${APP_STORAGE_LOCAL_ROOT:./uploads}
  filemanager:
    cleanup:
      orphan-hours: ${APP_FILEMANAGER_CLEANUP_ORPHAN_HOURS:24}
      expired-hours: ${APP_FILEMANAGER_CLEANUP_EXPIRED_HOURS:720}
      rogue-grace-hours: ${APP_FILEMANAGER_CLEANUP_ROGUE_GRACE_HOURS:1}
      cron: ${APP_FILEMANAGER_CLEANUP_CRON:0 0 3 * * *}
  news:
    archiving:
      cron: ${APP_NEWS_ARCHIVING_CRON:0 5 0 * * *}