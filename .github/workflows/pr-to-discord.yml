name: PR to Discord (dev only)

on:
  pull_request:
    types: [opened, review_requested]
  pull_request_review:
    types: [submitted]

jobs:
  discord:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'dev'
    steps:
      - name: Notify Discord about PR
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "content": "🔔 **New Pull Request**\n👤 Author: **${{ github.event.pull_request.user.login }}**\n
          📌 Title: ${{ github.event.pull_request.title }}\n🔗 ${{ github.event.pull_request.html_url }}"
          }' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}