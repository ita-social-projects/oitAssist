name: PR to Discord (dev only)

on:
  pull_request:
    types: [opened, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted]

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Check target branch
        id: branch
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" != "dev" ]; then
            echo "Not dev branch, skipping"
            exit 0
          fi

      - name: Send Discord notification
        if: github.event.action != 'closed'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEWERS_JSON: ${{ toJson(github.event.pull_request.requested_reviewers) }}
        run: |
          REVIEWERS=$(echo "$REVIEWERS_JSON" | jq -r '.[].login' | paste -sd ", " -)
          [ -z "$REVIEWERS" ] && REVIEWERS="—"

          PAYLOAD=$(jq -n \
          --arg title "$PR_TITLE" \
          --arg author "$PR_AUTHOR" \
          --arg reviewers "$REVIEWERS" \
          --arg url "$PR_URL" \
          '{
          content: "🚀 **PR to dev**\n" +
                     "**Title:** \($title)\n" +
                     "**Author:** \($author)\n" +
                     "**Reviewers:** \($reviewers)\n" +
                     "🔗 \($url)"
          }')

          RESPONSE=$(curl -s -X POST "$DISCORD_WEBHOOK_URL?wait=true" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          MESSAGE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "MESSAGE_ID=$MESSAGE_ID" >> "$GITHUB_ENV"