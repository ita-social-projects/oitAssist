name: PR to Discord (dev only)

on:
  pull_request:
    types: [opened, review_requested]
  pull_request_review:
    types: [submitted]

jobs:
  discord:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'dev'
    steps:
      - name: Process Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_STATE: ${{ github.event.review.state }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_ID=$(echo "$PR_BODY" | grep -oP '(?<=)' || echo "")

          STATUS_EMOJI="🚀"
          if [[ "$REVIEW_STATE" == "approved" ]]; then
            STATUS_EMOJI="✅"
          elif [[ "$REVIEW_STATE" == "changes_requested" ]]; then
            STATUS_EMOJI="❌"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$PR_TITLE" \
            --arg author "$PR_AUTHOR" \
            --arg url "$PR_URL" \
            --arg emoji "$STATUS_EMOJI" \
            '{
              content: "\($emoji) **PR to dev**\n**Title:** \($title)\n**Author:** \($author)\n🔗 \($url)"
            }')

          if [ -z "$EXISTING_ID" ]; then
            RESPONSE=$(curl -s -X POST "${DISCORD_WEBHOOK_URL}?wait=true" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          
            NEW_ID=$(echo "$RESPONSE" | jq -r '.id')

            NEW_BODY="${PR_BODY}\n\n"
            curl -s -X PATCH -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg body "$NEW_BODY" '{body: $body}')" \
              "${{ github.event.pull_request.url }}"
          else
            curl -s -X PATCH "${DISCORD_WEBHOOK_URL}/messages/${EXISTING_ID}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          fi