name: CI/CD OITAssist

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:
  repository_dispatch:
    types: [ frontend-built ]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Run a multi-line script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          git fetch --unshallow
          mvn clean install sonar:sonar \
            -Dsonar.projectKey=ita-social-projects_oitAssist \
            -Dsonar.organization=ita-social-projects \
            -Dsonar.host.url=https://sonarcloud.io \

      - name: Test Reporter
        #v1.5.0
        uses: dorny/test-reporter@0d00bb14cb0cc2c9b8985df6e81dd333188224e1
        if: success() || failure()
        with:
          name: Tests Report
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit

  build-and-push-backend-image:
    needs: build
    #if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: ita-social-projects/oitClient
          ref: dev
          path: frontend

      - name: Build frontend
        run: |
          cd frontend
          npm install -g pnpm
          pnpm install
          pnpm run build

      - name: Copy frontend into backend
        run: |
          mkdir -p src/main/resources/static
          rm -rf src/main/resources/static/*
          cp -r frontend/dist/* src/main/resources/static/

      - name: Build backend jar
        run: mvn clean package -DskipTests

      - name: Login to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image for backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/oitassist/build:latest