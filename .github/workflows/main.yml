name: CI/CD OITAssist

# Controls when the action will run.
on:

  # Triggers the workflow on push or pull request events for dev and prod
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

concurrency: Testing

jobs:
  build:
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Run a multi-line script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          git fetch --unshallow
          mvn clean install sonar:sonar \
            -Dsonar.projectKey=ita-social-projects_oitAssist \
            -Dsonar.organization=ita-social-projects \
            -Dsonar.host.url=https://sonarcloud.io \

      - name: Test Reporter
        #v1.5.0
        uses: dorny/test-reporter@0d00bb14cb0cc2c9b8985df6e81dd333188224e1

        if: success() || failure()
        with:
          name: Tests Report
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit

      - name: Rename user jar to app
        run: mv $userRepoName/target/*.jar $userRepoName/target/$onbootJarName

      - name: Set outputs
        run: echo "GITHUB_SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV